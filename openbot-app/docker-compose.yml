version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: openbot-app_web_1
      APP_PORT: 80

  openbot:
    image: ghcr.io/nightly-labs/openbot:latest
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    shm_size: 1g
    stop_grace_period: 60s
    volumes:
      - ${APP_DATA_DIR}/data:/data

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/www:/usr/share/nginx/html:ro
