manifestVersion: 1
id: openbot-app
name: OpenBot
tagline: Local-first workspace & persistent AI teammates
category: ai
version: "0.76.1"
port: 8092
description: >-
  OpenBot is a local-first workspace for persistent AI teammates. It connects to
  Codex, Claude Code, Grok, Gemini, Cursor, Cline, Devin, and Hermes Agent.


  Each agent gets its own workspace, conversation, local queues, file transfers,
  and embedded browser in one system.


  ⚡ GETTING STARTED ON UMBREL:


  1. Open the OpenBot app tile to view the local management portal.

  2. Sign in or claim the server by opening the Umbrel Terminal or SSH and running:

     docker exec -it openbot-app_openbot_1 openbot login

  3. Use your server from https://openbot.run/app, or connect your desktop and mobile apps!
